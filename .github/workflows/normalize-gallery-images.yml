name: Normalize gallery images

on:
  push:
    paths:
      - '.image-fix/READY'

permissions:
  contents: write

jobs:
  rebuild-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild normalized JPEGs
        shell: bash
        run: |
          if [ ! -f .image-fix/READY ]; then
            echo "No image rebuild requested."
            exit 0
          fi

          cat .image-fix/3324/real-* | tr -d '\n\r' | base64 --decode > images/IMG_3324.jpeg
          cat .image-fix/3325/real-* | tr -d '\n\r' | base64 --decode > images/IMG_3325.jpeg

          file images/IMG_3324.jpeg
          file images/IMG_3325.jpeg

          rm -rf .image-fix
          rm -f .github/workflows/normalize-gallery-images.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize gallery images for consistent color"
          git push
