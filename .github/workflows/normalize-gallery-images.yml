name: Normalize gallery images

on:
  push:
    paths:
      - '.image-fix/READY'

permissions:
  contents: write

jobs:
  normalize-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize JPEG color and metadata
        shell: bash
        run: |
          set -e
          if [ ! -f .image-fix/READY ]; then
            echo "No image normalization requested."
            exit 0
          fi

          if command -v magick >/dev/null 2>&1; then
            IMG_CMD="magick"
          elif command -v convert >/dev/null 2>&1; then
            IMG_CMD="convert"
          else
            sudo apt-get update
            sudo apt-get install -y imagemagick
            IMG_CMD="convert"
          fi

          $IMG_CMD images/IMG_3324.jpeg -auto-orient -strip -colorspace sRGB -quality 92 images/IMG_3324.normalized.jpeg
          $IMG_CMD images/IMG_3325.jpeg -auto-orient -strip -colorspace sRGB -quality 92 images/IMG_3325.normalized.jpeg

          mv images/IMG_3324.normalized.jpeg images/IMG_3324.jpeg
          mv images/IMG_3325.normalized.jpeg images/IMG_3325.jpeg

          file images/IMG_3324.jpeg
          file images/IMG_3325.jpeg

          rm -rf .image-fix
          rm -f .github/workflows/normalize-gallery-images.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize gallery images for consistent color"
          git push
